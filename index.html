<!DOCTYPE html>
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf9f5;
    --paper-deep:#f2f0e8;
    --line:#dcd9cc;
    --line-soft:#e9e7dc;
    --ink:#1e2a2b;
    --ink-soft:#5a6866;
    --ink-faint:#93a09c;
    --sage:#4f7a5c;
    --sage-dark:#365441;
    --sage-tint:#e2ebe3;
    --rust:#8a4a35;
    --rust-tint:#f3e3dc;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px);
    background-size:100% 32px;
    color:var(--ink);
    font-family:'Space Grotesk', -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .ruler{
    height:14px;
    background-image:repeating-linear-gradient(to right, var(--ink-faint) 0, var(--ink-faint) 1px, transparent 1px, transparent 12px);
    background-position:6px 0;
    opacity:0.55;
  }
  .wrap{max-width:640px; margin:0 auto; padding:28px 20px 60px;}

  header.top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:6px;}
  header.top .brand{font-weight:700; font-size:22px; letter-spacing:-0.01em;}
  header.top .brand small{display:block; font-family:'JetBrains Mono', monospace; font-weight:400; font-size:11px; letter-spacing:0.12em; color:var(--ink-faint); text-transform:uppercase; margin-top:2px;}
  header.top .tool-tag{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--sage-dark); background:var(--sage-tint); border:1px solid var(--line); padding:3px 8px; border-radius:20px; cursor:pointer;}

  /* ---- home grid ---- */
  .stage-label{
    font-size:13px; letter-spacing:0.08em; font-weight:700; color:var(--sage-dark);
    margin:26px 0 10px; font-family:'Space Grotesk', sans-serif;
    border-bottom: 2px solid var(--sage-tint); padding-bottom: 4px;
  }
  .calc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .calc-card{
    text-align:left; cursor:pointer; background:var(--paper-deep); border:1px solid var(--line);
    border-radius:6px; padding:14px 14px 12px; font-family:'Space Grotesk', sans-serif;
  }
  .calc-card:hover{border-color:var(--sage-dark);}
  .calc-card .cc-num{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint);}
  .calc-card .cc-name{font-weight:700; font-size:15px; margin-top:4px;}
  .calc-card .cc-desc{font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.4;}
  @media (max-width:420px){ .calc-grid{grid-template-columns:1fr;} }

  /* ---- calc view ---- */
  .back-btn{
    background:none; border:none; cursor:pointer; font-family:'JetBrains Mono', monospace;
    font-size:12px; color:var(--ink-soft); padding:0; margin:22px 0 4px;
  }
  .back-btn:hover{color:var(--sage-dark);}
  .calc-title{font-weight:700; font-size:20px; margin:2px 0 0;}

  nav.tabs{display:flex; gap:2px; margin:18px 0 0; border-bottom:1px solid var(--line);}
  nav.tabs button{
    flex:1; appearance:none; border:1px solid transparent; border-bottom:none; background:transparent;
    padding:11px 10px; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13.5px;
    color:var(--ink-soft); cursor:pointer; border-radius:var(--radius) var(--radius) 0 0; position:relative; top:1px;
  }
  nav.tabs button.active{color:var(--ink); background:var(--paper-deep); border-color:var(--line); border-bottom:1px solid var(--paper-deep);}

  section.panel{display:none; background:var(--paper-deep); border:1px solid var(--line); border-top:none; border-radius:0 0 6px 6px; padding:24px 22px 26px;}
  section.panel.active{display:block;}

  .field{margin-bottom:20px;}
  .field label{display:block; font-size:12px; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; font-weight:600;}
  .field .input-row{display:flex; align-items:baseline; gap:8px; border-bottom:2px solid var(--ink); padding-bottom:6px;}
  .field input, .field select{flex:1; border:none; background:transparent; font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:600; color:var(--ink); padding:2px 0; outline:none; min-width:0;}
  .field input::placeholder{color:var(--ink-faint); font-weight:400;}
  .field .unit{font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--ink-faint);}
  .field .input-row:focus-within{border-color:var(--sage-dark);}

  .btn{appearance:none; border:none; cursor:pointer; font-family:'Space Grotesk', sans-serif; font-weight:600; border-radius:20px; padding:12px 22px; font-size:14px; letter-spacing:0.01em;}
  .btn-primary{width:100%; background:var(--sage-dark); color:#fff;}
  .btn-primary:hover{background:var(--sage);}
  .btn-ghost{background:transparent; color:var(--rust); border:1px solid var(--line); padding:7px 14px; font-size:12px;}
  .btn-ghost:hover{background:var(--rust-tint);}

  .error{color:var(--rust); font-size:12.5px; margin-top:8px; font-family:'JetBrains Mono', monospace; display:none;}

  .readout{margin-top:26px; border-top:1px dashed var(--line); padding-top:22px; display:none;}
  .readout.show{display:block;}
  .readout .label{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:4px;}
  .readout .value-row{display:flex; align-items:baseline; gap:10px; border-bottom:3px solid var(--ink); padding-bottom:8px; flex-wrap:wrap;}
  .readout .value{font-family:'JetBrains Mono', monospace; font-size:32px; font-weight:700; letter-spacing:-0.02em;}
  .readout .value-unit{font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--ink-faint);}
  .readout .detail{margin-top:8px; font-size:13px; color:var(--ink-soft); white-space: pre-line;}
  .badge{display:inline-block; margin-top:10px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; font-family:'JetBrains Mono', monospace;}
  .badge.low{background:#e5eef7; color:#2f5f80;}
  .badge.normal{background:var(--sage-tint); color:var(--sage-dark);}
  .badge.over{background:#f8ecd4; color:#8a6a1f;}
  .badge.obese{background:var(--rust-tint); color:var(--rust);}

  .prev-box{margin-top:16px; display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--ink-soft); gap:8px; flex-wrap:wrap;}
  .prev-box .prev-value{font-family:'JetBrains Mono', monospace; color:var(--ink); font-weight:600;}
  .diff-up{color:var(--rust);}
  .diff-down{color:var(--sage-dark);}

  .hist-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .hist-head h2{font-size:14px; margin:0; letter-spacing:0.03em;}
  .hist-list{list-style:none; margin:0 0 26px; padding:0; border-top:1px solid var(--line);}
  .hist-list li{display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line-soft); font-size:13.5px; gap:8px;}
  .hist-list .hd-date{font-family:'JetBrains Mono', monospace; color:var(--ink-soft); font-size:12px;}
  .hist-list .hd-vals{color:var(--ink-faint); font-size:11.5px; margin-top:2px;}
  .hist-list .hd-bmi{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px; text-align:right;}
  .hist-list button.del{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:16px; padding:2px 6px;}
  .hist-list button.del:hover{color:var(--rust);}
  .empty-note{color:var(--ink-faint); font-size:13px; padding:20px 2px; text-align:center; border:1px dashed var(--line); border-radius:6px;}

  .graph-box{margin-bottom:24px;}
  .graph-box h2{font-size:14px; margin:0 0 10px; letter-spacing:0.03em;}
  svg.graph{width:100%; height:auto; display:block;}
  .graph-grid line{stroke:var(--line-soft); stroke-width:1;}
  .graph-axis text{font-family:'JetBrains Mono', monospace; font-size:9px; fill:var(--ink-faint);}
  .graph-line{fill:none; stroke:var(--sage-dark); stroke-width:2; stroke-dasharray:4 3;}
  .graph-point{fill:var(--sage-dark);}

  .predict-box{border:1px solid var(--line); background:var(--paper); border-radius:6px; padding:16px 16px 14px;}
  .predict-box .p-label{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--rust); font-weight:600; margin-bottom:6px;}
  .predict-box .p-value{font-family:'JetBrains Mono', monospace; font-size:28px; font-weight:700; color:var(--ink);}
  .predict-box .p-note{font-size:12px; color:var(--ink-soft); margin-top:8px; line-height:1.6;}
  .predict-box .p-caveat{font-size:11px; color:var(--ink-faint); margin-top:10px; border-top:1px dashed var(--line); padding-top:8px;}
  .predict-none{font-size:12.5px; color:var(--ink-faint); padding:14px 2px;}

  .footer-note{text-align:center; font-size:11px; color:var(--ink-faint); margin-top:30px; font-family:'JetBrains Mono', monospace;}
</style>
</head>
<body>
<div class="ruler"></div>
<div class="wrap">

  <header class="top">
    <div class="brand">Smart Calculator<small>計算 → 記録 → 予測</small></div>
    <div class="tool-tag" id="homeBtn">一覧に戻る</div>
  </header>

  <!-- ===== HOME ===== -->
  <div id="view-home">
    <div id="categoryContainer"></div>
  </div>

  <!-- ===== CALC VIEW ===== -->
  <div id="view-calc" style="display: none;">
    <button class="back-btn" id="backBtn">← 一覧に戻る</button>
    <h1 class="calc-title" id="calcTitle">計算機</h1>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="calc">計算する</button>
      <button class="tab-btn" data-tab="history">履歴・グラフ</button>
    </nav>

    <section class="panel active" id="panel-calc">
      <div id="fieldsContainer"></div>
      <button class="btn btn-primary" id="calcBtn">計算する</button>
      <div class="error" id="errorMsg" style="display: none;"></div>

      <div class="readout" id="readout">
        <div class="label" id="readoutLabel">結果</div>
        <div class="value-row">
          <span class="value mono" id="resultValue">--</span>
          <span class="value-unit" id="resultUnit"></span>
        </div>
        <span class="badge" id="resultBadge" style="display:none;"></span>
        <div class="detail" id="resultDetail" style="display:none;"></div>
        <div class="prev-box" id="prevBox" style="display:none;">
          <span>前回（<span class="mono" id="prevDate"></span>）</span>
          <span class="prev-value mono" id="prevValue"></span>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-history">
      <div class="graph-box" id="graphSection" style="display: block;">
        <h2>推移グラフ</h2>
        <div id="graphContainer"><div class="empty-note">履歴が貯まるとグラフが表示されます。</div></div>
      </div>
      <div class="graph-box" id="predictSection" style="display: block;">
        <h2>簡易予測</h2>
        <div id="predictContainer"><div class="predict-none">予測にはあと 3 回分のデータが必要です（現在 0 回）。</div></div>
      </div>
      <div class="hist-head">
        <h2>計算履歴</h2>
        <button class="btn btn-ghost" id="clearAllBtn">全履歴削除</button>
      </div>
      <ul class="hist-list" id="histList"><li style="border:none;"><div class="empty-note" style="width:100%;">まだ履歴がありません。計算するとここに記録されます。</div></li></ul>
    </section>
  </div>

  <div class="footer-note">DATA STORED IN THIS BROWSER ONLY — 端末ごとに保存されます</div>
</div>

<script>
(function(){

  function round1(n){ return Math.round(n*10)/10; }
  function round2(n){ return Math.round(n*100)/100; }
  function fmtDate(iso){
    const d = new Date(iso);
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}/${m}/${day}`;
  }

  function fact(n){
    if(n < 0) return 0;
    if(n === 0 || n === 1) return 1;
    let res = 1;
    for(let i=2; i<=n; i++) res *= i;
    return res;
  }
  function perm(n, r){
    if(n < r || n < 0 || r < 0) return 0;
    let res = 1;
    for(let i=0; i<r; i++) res *= (n - i);
    return res;
  }
  function comb(n, r){
    if(n < r || n < 0 || r < 0) return 0;
    return perm(n, r) / fact(r);
  }

  const CATEGORIES = [
    {
      categoryName: '日常で使う計算',
      calculators: [
        {
          id:'ratio', name:'割合計算機', desc:'ある数が全体の何%かを計算', unit:'%', trend:true,
          fields:[
            {id:'part', label:'一部の値', type:'number', placeholder:'150'},
            {id:'whole', label:'全体の値', type:'number', placeholder:'500'}
          ],
          compute(v){
            const pct = (v.part / v.whole) * 100;
            return {value:round2(pct), display:round2(pct).toFixed(2)};
          },
          inputSummary(v){ return `${v.part} / ${v.whole}`; }
        },
        {
          id:'percent', name:'パーセント計算機', desc:'ある数の○%の値を計算', unit:'', trend:true,
          fields:[
            {id:'base', label:'元の数', type:'number', placeholder:'500'},
            {id:'percent', label:'パーセント', type:'number', unit:'%', placeholder:'20'}
          ],
          compute(v){
            const result = v.base * v.percent / 100;
            return {value:round2(result), display:round2(result).toLocaleString()};
          },
          inputSummary(v){ return `${v.base} の ${v.percent}%`; }
        },
        {
          id:'basic_arithmetic', name:'四則演算', desc:'2つの数値の加減乗除を計算', unit:'', trend:false,
          fields:[
            {id:'num1', label:'数値1', type:'number', placeholder:'10'},
            {id:'op', label:'演算子', type:'select', options:[{v:'+',l:'＋ (足し算)'},{v:'-',l:'－ (引き算)'},{v:'*',l:'× (掛け算)'},{v:'/',l:'÷ (割り算)'}]},
            {id:'num2', label:'数値2', type:'number', placeholder:'5'}
          ],
          compute(v){
            let res = 0;
            if(v.op === '+') res = v.num1 + v.num2;
            else if(v.op === '-') res = v.num1 - v.num2;
            else if(v.op === '*') res = v.num1 * v.num2;
            else if(v.op === '/') {
              if(v.num2 === 0) return {error:'0で割ることはできません'};
              res = v.num1 / v.num2;
            }
            return {value:round2(res), display:round2(res).toLocaleString()};
          },
          inputSummary(v){ return `${v.num1} ${v.op} ${v.num2}`; }
        },
        {
          id:'bmi', name:'BMI計算機', desc:'身長と体重から肥満度を判定', unit:'kg/m²', trend:true,
          fields:[
            {id:'height', label:'身長', type:'number', unit:'cm', placeholder:'170', min:50, max:250},
            {id:'weight', label:'体重', type:'number', unit:'kg', placeholder:'60', min:10, max:300}
          ],
          compute(v){
            const bmi = v.weight / Math.pow(v.height/100, 2);
            const r = round1(bmi);
            let cat;
            if(bmi<18.5) cat={label:'低体重', cls:'low'};
            else if(bmi<25) cat={label:'普通体重', cls:'normal'};
            else if(bmi<30) cat={label:'肥満（1度）', cls:'over'};
            else cat={label:'肥満（2度以上）', cls:'obese'};
            return {value:r, display:r.toFixed(1), category:cat};
          },
          inputSummary(v){ return `身長 ${v.height}cm ・ 体重 ${v.weight}kg`; }
        }
      ]
    },
    {
      categoryName: 'お金の計算',
      calculators: [
        {
          id:'discount', name:'割引計算', desc:'元の価格から割引後の金額を計算', unit:'円', trend:false,
          fields:[
            {id:'price', label:'元の価格', type:'number', unit:'円', placeholder:'1000'},
            {id:'discount', label:'割引率', type:'number', unit:'%', placeholder:'20'}
          ],
          compute(v){
            const saved = v.price * (v.discount / 100);
            const finalPrice = v.price - saved;
            return {value:Math.round(finalPrice), display:Math.round(finalPrice).toLocaleString(), detail:`お得になった金額: ${Math.round(saved).toLocaleString()} 円`};
          },
          inputSummary(v){ return `${v.price}円の${v.discount}%引き`; }
        },
        {
          id:'tax', name:'消費税計算', desc:'税抜き価格から税込価格（8%/10%）を計算', unit:'円', trend:false,
          fields:[
            {id:'price', label:'税抜き価格', type:'number', unit:'円', placeholder:'1000'},
            {id:'rate', label:'税率', type:'select', options:[{v:'10',l:'10% (標準税率)'},{v:'8',l:'8% (軽減税率)'}]}
          ],
          compute(v){
            const r = parseFloat(v.rate) / 100;
            const tax = v.price * r;
            const total = v.price + tax;
            return {value:Math.round(total), display:Math.round(total).toLocaleString(), detail:`消費税額: ${Math.round(tax).toLocaleString()} 円`};
          },
          inputSummary(v){ return `${v.price}円 (税率${v.rate}%)`; }
        },
        {
          id:'compound', name:'複利計算', desc:'元本・利率・期間から将来の運用資産を計算', unit:'円', trend:true,
          fields:[
            {id:'principal', label:'元本', type:'number', unit:'円', placeholder:'1000000'},
            {id:'rate', label:'年利率', type:'number', unit:'%', placeholder:'3'},
            {id:'years', label:'運用期間', type:'number', unit:'年', placeholder:'10'}
          ],
          compute(v){
            const total = v.principal * Math.pow(1 + (v.rate/100), v.years);
            const profit = total - v.principal;
            return {value:Math.round(total), display:Math.round(total).toLocaleString(), detail:`増えた利息分: ${Math.round(profit).toLocaleString()} 円`};
          },
          inputSummary(v){ return `元本${v.principal}円/年利${v.rate}%/${v.years}年`; }
        },
        {
          id:'margin', name:'利益率計算', desc:'原価と売価から利益額と利益率を計算', unit:'%', trend:true,
          fields:[
            {id:'cost', label:'原価', type:'number', unit:'円', placeholder:'800'},
            {id:'price', label:'売価 (販売価格)', type:'number', unit:'円', placeholder:'1000'}
          ],
          compute(v){
            const profit = v.price - v.cost;
            const margin = (profit / v.price) * 100;
            return {value:round2(margin), display:`${round2(margin)} %`, detail:`利益額: ${profit.toLocaleString()} 円`};
          },
          inputSummary(v){ return `原価${v.cost}円 / 売価${v.price}円`; }
        },
        {
          id:'hourly', name:'時給計算', desc:'時給と労働時間から日給・月給目安を計算', unit:'円', trend:true,
          fields:[
            {id:'wage', label:'時給', type:'number', unit:'円', placeholder:'1100'},
            {id:'hours', label:'1日の労働時間', type:'number', unit:'時間', placeholder:'8'},
            {id:'days', label:'月間勤務日数', type:'number', unit:'日', placeholder:'20'}
          ],
          compute(v){
            const daily = v.wage * v.hours;
            const monthly = daily * v.days;
            return {value:monthly, display:`月給目安: ${monthly.toLocaleString()}`, detail:`日給目安: ${daily.toLocaleString()} 円`};
          },
          inputSummary(v){ return `時給${v.wage}円 / ${v.hours}h / 月${v.days}日`; }
        },
        {
          id:'salary', name:'給与手取り概算', desc:'額面給与からおおよその手取り額(約80%)を計算', unit:'円', trend:true,
          fields:[
            {id:'gross', label:'額面月給', type:'number', unit:'円', placeholder:'250000'}
          ],
          compute(v){
            const net = v.gross * 0.8;
            const deductions = v.gross - net;
            return {value:Math.round(net), display:`約 ${Math.round(net).toLocaleString()}`, detail:`控除額(税金・保険料等)目安: 約 ${Math.round(deductions).toLocaleString()} 円`};
          },
          inputSummary(v){ return `額面 ${v.gross}円`; }
        }
      ]
    },
    {
      categoryName: '数学・データ分析の基礎',
      calculators: [
        {
          id:'mean', name:'平均値計算', desc:'カンマ区切りの数値群から平均値を計算', unit:'', trend:false,
          fields:[
            {id:'list', label:'数値リスト（カンマ区切り）', type:'text', placeholder:'10, 20, 30, 40, 50'}
          ],
          compute(v){
            const nums = v.list.split(',').map(n=>parseFloat(n.trim())).filter(n=>!isNaN(n));
            if(nums.length === 0) return {error:'有効な数値を入力してください'};
            const sum = nums.reduce((a,b)=>a+b,0);
            const avg = sum / nums.length;
            return {value:round2(avg), display:round2(avg).toLocaleString(), detail:`データ件数: ${nums.length} 件 / 合計: ${sum}`};
          },
          inputSummary(v){ return `${v.list}`; }
        },
        {
          id:'median', name:'中央値計算', desc:'数値群の中央値（メディアン）を算出', unit:'', trend:false,
          fields:[
            {id:'list', label:'数値リスト（カンマ区切り）', type:'text', placeholder:'10, 50, 20, 40, 30'}
          ],
          compute(v){
            const nums = v.list.split(',').map(n=>parseFloat(n.trim())).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
            if(nums.length === 0) return {error:'有効な数値を入力してください'};
            let med;
            const mid = Math.floor(nums.length / 2);
            if(nums.length % 2 === 0){
              med = (nums[mid - 1] + nums[mid]) / 2;
            } else {
              med = nums[mid];
            }
            return {value:round2(med), display:round2(med).toLocaleString(), detail:`ソート順: ${nums.join(', ')}`};
          },
          inputSummary(v){ return `${v.list}`; }
        },
        {
          id:'sd', name:'標準偏差計算', desc:'数値群の分散および標準偏差を算出', unit:'', trend:false,
          fields:[
            {id:'list', label:'数値リスト（カンマ区切り）', type:'text', placeholder:'60, 70, 80, 90, 100'}
          ],
          compute(v){
            const nums = v.list.split(',').map(n=>parseFloat(n.trim())).filter(n=>!isNaN(n));
            if(nums.length < 2) return {error:'2つ以上の数値を入力してください'};
            const avg = nums.reduce((a,b)=>a+b,0) / nums.length;
            const variance = nums.reduce((a,b)=>a+Math.pow(b-avg,2),0) / nums.length;
            const sd = Math.sqrt(variance);
            return {value:round2(sd), display:round2(sd).toLocaleString(), detail:`分散: ${round2(variance)} / 平均: ${round2(avg)}`};
          },
          inputSummary(v){ return `${v.list}`; }
        },
        {
          id:'probability', name:'確率計算', desc:'指定した試行における確率を計算', unit:'%', trend:false,
          fields:[
            {id:'target', label:'対象の起こる通り数', type:'number', placeholder:'1'},
            {id:'total', label:'すべての起こり得る通り数', type:'number', placeholder:'6'}
          ],
          compute(v){
            if(v.total <= 0) return {error:'全通り数は1以上を指定してください'};
            const prob = (v.target / v.total) * 100;
            return {value:round2(prob), display:`${round2(prob)} %`, detail:`分数表現: ${v.target} / ${v.total}`};
          },
          inputSummary(v){ return `${v.target} / ${v.total}`; }
        },
        {
          id:'comb', name:'順列・組み合わせ', desc:'nPr (順列) と nCr (組み合わせ) を計算', unit:'', trend:false,
          fields:[
            {id:'n', label:'全体数 (n)', type:'number', placeholder:'5'},
            {id:'r', label:'選ぶ数 (r)', type:'number', placeholder:'2'}
          ],
          compute(v){
            if(v.n < v.r) return {error:'nはr以上の値を入力してください'};
            const pVal = perm(v.n, v.r);
            const cVal = comb(v.n, v.r);
            return {value:cVal, display:`組み合わせ (nCr): ${cVal.toLocaleString()}`, detail:`順列 (nPr): ${pVal.toLocaleString()} 通り`};
          },
          inputSummary(v){ return `n=${v.n}, r=${v.r}`; }
        },
        {
          id:'factor', name:'素因数分解', desc:'整数を素数の積に分解', unit:'', trend:false,
          fields:[
            {id:'num', label:'分解する整数', type:'number', placeholder:'360', min:2}
          ],
          compute(v){
            let n = Math.floor(v.num);
            if(n < 2) return {error:'2以上の整数を入力してください'};
            const factors = [];
            let d = 2;
            while(n >= 2){
              if(n % d === 0){
                factors.push(d);
                n /= d;
              } else {
                d++;
                if(d * d > n){
                  if(n > 1) factors.push(n);
                  break;
                }
              }
            }
            return {value:null, display:factors.join(' × '), detail:`素因数の数: ${factors.length} 個`};
          },
          inputSummary(v){ return `${v.num}`; }
        },
        {
          id:'quadratic', name:'二次方程式の解', desc:'ax² + bx + c = 0 の解を解の公式で算出', unit:'', trend:false,
          fields:[
            {id:'a', label:'係数 a', type:'number', placeholder:'1'},
            {id:'b', label:'係数 b', type:'number', placeholder:'-5'},
            {id:'c', label:'定数 c', type:'number', placeholder:'6'}
          ],
          compute(v){
            if(v.a === 0) return {error:'aは0以外を入力してください'};
            const D = v.b*v.b - 4*v.a*v.c;
            if(D > 0){
              const x1 = (-v.b + Math.sqrt(D)) / (2*v.a);
              const x2 = (-v.b - Math.sqrt(D)) / (2*v.a);
              return {value:null, display:`x = ${round2(x1)},  ${round2(x2)}`, detail:`判別式 D = ${D} (>0 : 異なる2つの実数解)`};
            } else if(D === 0){
              const x = -v.b / (2*v.a);
              return {value:null, display:`x = ${round2(x)} (重解)`, detail:`判別式 D = 0`};
            } else {
              const real = round2(-v.b / (2*v.a));
              const imag = round2(Math.sqrt(-D) / (2*v.a));
              return {value:null, display:`x = ${real} ± ${imag}i`, detail:`判別式 D = ${D} (<0 : 虚数解)`};
            }
          },
          inputSummary(v){ return `${v.a}x² + ${v.b}x + ${v.c} = 0`; }
        }
      ]
    },
    {
      categoryName: '単位と測定',
      calculators: [
        {
          id:'unit_conv', name:'単位変換 (長さ)', desc:'m, km, cm, mm, inch, feet の相互変換', unit:'', trend:false,
          fields:[
            {id:'val', label:'変換元の値', type:'number', placeholder:'1'},
            {id:'from', label:'変換元単位', type:'select', options:[{v:'m',l:'メートル (m)'},{v:'km',l:'キロメートル (km)'},{v:'cm',l:'センチメートル (cm)'},{v:'mm',l:'ミリメートル (mm)'},{v:'inch',l:'インチ (in)'},{v:'ft',l:'フィート (ft)'}]},
            {id:'to', label:'変換先単位', type:'select', options:[{v:'m',l:'メートル (m)'},{v:'km',l:'キロメートル (km)'},{v:'cm',l:'センチメートル (cm)'},{v:'mm',l:'ミリメートル (mm)'},{v:'inch',l:'インチ (in)'},{v:'ft',l:'フィート (ft)'}]}
          ],
          compute(v){
            const ratesInM = { m:1, km:1000, cm:0.01, mm:0.001, inch:0.0254, ft:0.3048 };
            const mVal = v.val * ratesInM[v.from];
            const result = mVal / ratesInM[v.to];
            return {value:round2(result), display:`${round2(result)} ${v.to}`};
          },
          inputSummary(v){ return `${v.val}${v.from} → ${v.to}`; }
        },
        {
          id:'area', name:'面積計算 (長方形/円)', desc:'図形の寸法から面積を計算', unit:'㎡', trend:false,
          fields:[
            {id:'shape', label:'図形', type:'select', options:[{v:'rect',l:'長方形・正方形'},{v:'circle',l:'円'}]},
            {id:'p1', label:'縦の長さ / 半径', type:'number', placeholder:'10'},
            {id:'p2', label:'横の長さ (円の場合は不要)', type:'number', placeholder:'5'}
          ],
          compute(v){
            if(v.shape === 'circle'){
              const area = Math.PI * v.p1 * v.p1;
              return {value:round2(area), display:`${round2(area)} ㎡`, detail:`円周の長さ: ${round2(2*Math.PI*v.p1)}`};
            } else {
              const area = v.p1 * (v.p2 || 0);
              return {value:round2(area), display:`${round2(area)} ㎡`};
            }
          },
          inputSummary(v){ return v.shape==='circle'?`半径:${v.p1}`:`縦:${v.p1}, 横:${v.p2}`; }
        },
        {
          id:'volume', name:'体積計算 (直方体/球/円柱)', desc:'立体図形の寸法から体積を計算', unit:'㎥', trend:false,
          fields:[
            {id:'shape', label:'立体形状', type:'select', options:[{v:'box',l:'直方体'},{v:'cylinder',l:'円柱'},{v:'sphere',l:'球'}]},
            {id:'v1', label:'縦 / 半径(円柱・球)', type:'number', placeholder:'5'},
            {id:'v2', label:'横 / 高さ(円柱)', type:'number', placeholder:'4'},
            {id:'v3', label:'高さ(直方体のみ)', type:'number', placeholder:'3'}
          ],
          compute(v){
            let vol = 0;
            if(v.shape==='box') vol = v.v1 * (v.v2||0) * (v.v3||0);
            else if(v.shape==='cylinder') vol = Math.PI * Math.pow(v.v1,2) * (v.v2||0);
            else if(v.shape==='sphere') vol = (4/3) * Math.PI * Math.pow(v.v1,3);
            return {value:round2(vol), display:`${round2(vol)} ㎥`};
          },
          inputSummary(v){ return `${v.shape} (${v.v1}, ${v.v2}, ${v.v3})`; }
        },
        {
          id:'weight', name:'重さ・質量変換', desc:'g, kg, t, lb(ポンド), oz(オンス) の変換', unit:'', trend:false,
          fields:[
            {id:'val', label:'値', type:'number', placeholder:'1000'},
            {id:'from', label:'変換元', type:'select', options:[{v:'g',l:'グラム (g)'},{v:'kg',l:'キログラム (kg)'},{v:'t',l:'トン (t)'},{v:'lb',l:'ポンド (lb)'},{v:'oz',l:'オンス (oz)'}]},
            {id:'to', label:'変換先', type:'select', options:[{v:'kg',l:'キログラム (kg)'},{v:'g',l:'グラム (g)'},{v:'t',l:'トン (t)'},{v:'lb',l:'ポンド (lb)'},{v:'oz',l:'オンス (oz)'}]}
          ],
          compute(v){
            const ratesInG = { g:1, kg:1000, t:1000000, lb:453.592, oz:28.3495 };
            const gVal = v.val * ratesInG[v.from];
            const res = gVal / ratesInG[v.to];
            return {value:round2(res), display:`${round2(res)} ${v.to}`};
          },
          inputSummary(v){ return `${v.val}${v.from} → ${v.to}`; }
        },
        {
          id:'temp', name:'温度変換 (℃ / ℉)', desc:'摂氏(℃)と華氏(℉)を相互変換', unit:'', trend:false,
          fields:[
            {id:'val', label:'温度', type:'number', placeholder:'25'},
            {id:'mode', label:'変換方向', type:'select', options:[{v:'c2f',l:'摂氏(℃) → 華氏(℉)'},{v:'f2c',l:'華氏(℉) → 摂氏(℃)'}]}
          ],
          compute(v){
            if(v.mode==='c2f'){
              const f = (v.val * 9/5) + 32;
              return {value:round1(f), display:`${round1(f)} ℉`};
            } else {
              const c = (v.val - 32) * 5/9;
              return {value:round1(c), display:`${round1(c)} ℃`};
            }
          },
          inputSummary(v){ return `${v.val} (${v.mode==='c2f'?'℃→℉':'℉→℃'})`; }
        },
        {
          id:'speed', name:'速度計算・変換', desc:'距離と時間から速度（時速/分速/秒速）を計算', unit:'km/h', trend:false,
          fields:[
            {id:'dist', label:'距離', type:'number', unit:'km', placeholder:'100'},
            {id:'time', label:'時間', type:'number', unit:'時間', placeholder:'2'}
          ],
          compute(v){
            if(v.time <= 0) return {error:'時間は0より大きい値を入力してください'};
            const kmh = v.dist / v.time;
            const ms = (kmh * 1000) / 3600;
            return {value:round1(kmh), display:`時速 ${round1(kmh)} km/h`, detail:`秒速: 約 ${round1(ms)} m/s`};
          },
          inputSummary(v){ return `${v.dist}km / ${v.time}時間`; }
        }
      ]
    }
  ];

  const ALL_CALCULATORS = CATEGORIES.flatMap(c => c.calculators);

  const KEY_PREFIX = 'smartcalc:';
  let currentCalc = null;
  let currentHistory = [];

  function storageKey(id, kind){ return `${KEY_PREFIX}${id}:${kind}`; }
  function loadJSON(key, fallback){
    try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch(e){ return fallback; }
  }
  function saveJSON(key, data){
    try{ localStorage.setItem(key, JSON.stringify(data)); }
    catch(e){ console.error('保存に失敗しました', e); }
  }

  const categoryContainer = document.getElementById('categoryContainer');
  let globalIndex = 1;

  CATEGORIES.forEach(cat => {
    const groupDiv = document.createElement('div');
    
    const label = document.createElement('div');
    label.className = 'stage-label';
    label.textContent = cat.categoryName;
    groupDiv.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'calc-grid';

    cat.calculators.forEach(c => {
      const card = document.createElement('div');
      card.className = 'calc-card';
      const numStr = String(globalIndex++).padStart(2, '0');
      card.innerHTML = `<div class="cc-num">${numStr}</div><div class="cc-name">${c.name}</div><div class="cc-desc">${c.desc}</div>`;
      card.addEventListener('click', ()=> openCalculator(c.id));
      grid.appendChild(card);
    });

    groupDiv.appendChild(grid);
    categoryContainer.appendChild(groupDiv);
  });

  document.getElementById('homeBtn').addEventListener('click', showHome);
  document.getElementById('backBtn').addEventListener('click', showHome);

  function showHome(){
    document.getElementById('view-home').style.display = 'block';
    document.getElementById('view-calc').style.display = 'none';
  }

  function openCalculator(id){
    currentCalc = ALL_CALCULATORS.find(c=>c.id===id);
    currentHistory = loadJSON(storageKey(id,'history'), []);
    document.getElementById('view-home').style.display = 'none';
    document.getElementById('view-calc').style.display = 'block';
    document.getElementById('calcTitle').textContent = currentCalc.name;

    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('.tab-btn[data-tab="calc"]').classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-calc').classList.add('active');

    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('readout').classList.remove('show');

    renderFields();
    renderHistoryList();
    renderGraph();
    renderPredict();
    showLastResultIfAny();
  }

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab==='history'){ renderHistoryList(); renderGraph(); renderPredict(); }
    });
  });

  function renderFields(){
    const container = document.getElementById('fieldsContainer');
    container.innerHTML = '';
    const last = loadJSON(storageKey(currentCalc.id,'last'), {});
    currentCalc.fields.forEach(f=>{
      const div = document.createElement('div');
      div.className = 'field';
      const unitHtml = f.unit ? `<span class="unit">${f.unit}</span>` : '';
      
      if(f.type === 'select'){
        const opts = f.options.map(o=>`<option value="${o.v}">${o.l}</option>`).join('');
        div.innerHTML = `
          <label for="f-${f.id}">${f.label}</label>
          <div class="input-row">
            <select id="f-${f.id}">${opts}</select>
          </div>`;
      } else {
        const inputType = f.type;
        const step = f.type==='number' ? ' step="any"' : '';
        div.innerHTML = `
          <label for="f-${f.id}">${f.label}</label>
          <div class="input-row">
            <input type="${inputType}" id="f-${f.id}" ${inputType==='number'?`inputmode="decimal" placeholder="${f.placeholder||''}"`:''}${step}>
            ${unitHtml}
          </div>`;
      }
      container.appendChild(div);
      if(last[f.id] !== undefined){
        document.getElementById('f-'+f.id).value = last[f.id];
      }
    });
  }

  function readFieldValues(){
    const values = {};
    for(const f of currentCalc.fields){
      const el = document.getElementById('f-'+f.id);
      const raw = el.value;
      if(f.type==='number'){
        const num = parseFloat(raw);
        if(raw==='' || isNaN(num)) return {error:`「${f.label}」を入力してください。`};
        if(f.min!==undefined && num<f.min) return {error:`「${f.label}」は${f.min}以上で入力してください。`};
        if(f.max!==undefined && num>f.max) return {error:`「${f.label}」は${f.max}以下で入力してください。`};
        values[f.id] = num;
      } else {
        if(!raw && f.type!=='select') return {error:`「${f.label}」を入力してください。`};
        values[f.id] = raw;
      }
    }
    return {values};
  }

  document.getElementById('calcBtn').addEventListener('click', ()=>{
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';
    const {values, error} = readFieldValues();
    if(error){ errEl.textContent = error; errEl.style.display='block'; document.getElementById('readout').classList.remove('show'); return; }

    const result = currentCalc.compute(values);
    if(result.error){
      errEl.textContent = result.error;
      errEl.style.display='block';
      document.getElementById('readout').classList.remove('show');
      return;
    }

    const prevEntry = currentHistory.length ? currentHistory[currentHistory.length-1] : null;
    displayResult(result, prevEntry);

    saveJSON(storageKey(currentCalc.id,'last'), values);
    const entry = {
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      date: new Date().toISOString(),
      inputs: values,
      result,
      inputSummary: currentCalc.inputSummary(values)
    };
    currentHistory.push(entry);
    saveJSON(storageKey(currentCalc.id,'history'), currentHistory);
    renderHistoryList();
  });

  function displayResult(result, prevEntry){
    document.getElementById('readoutLabel').textContent = currentCalc.name.replace('計算機','');
    document.getElementById('resultValue').textContent = result.display;
    document.getElementById('resultUnit').textContent = currentCalc.unit || '';

    const badgeEl = document.getElementById('resultBadge');
    if(result.category){
      badgeEl.style.display = 'inline-block';
      badgeEl.textContent = result.category.label;
      badgeEl.className = 'badge ' + result.category.cls;
    } else { badgeEl.style.display = 'none'; }

    const detailEl = document.getElementById('resultDetail');
    if(result.detail){ detailEl.style.display='block'; detailEl.textContent = result.detail; }
    else { detailEl.style.display = 'none'; }

    const prevBox = document.getElementById('prevBox');
    if(prevEntry){
      prevBox.style.display = 'flex';
      document.getElementById('prevDate').textContent = fmtDate(prevEntry.date);
      if(currentCalc.trend && result.value!==null && prevEntry.result.value!==null){
        const diff = result.value - prevEntry.result.value;
        const diffStr = (diff>0?'+':'') + round2(diff);
        const diffCls = diff>0 ? 'diff-up' : (diff<0 ? 'diff-down':'');
        document.getElementById('prevValue').innerHTML = `${prevEntry.result.display} <span class="${diffCls}">(${diffStr})</span>`;
      } else {
        document.getElementById('prevValue').textContent = prevEntry.result.display;
      }
    } else {
      prevBox.style.display = 'none';
    }
    document.getElementById('readout').classList.add('show');
  }

  function showLastResultIfAny(){
    if(currentHistory.length===0) return;
    const latest = currentHistory[currentHistory.length-1];
    const prev = currentHistory.length>1 ? currentHistory[currentHistory.length-2] : null;
    displayResult(latest.result, prev);
  }

  function renderHistoryList(){
    const histList = document.getElementById('histList');
    histList.innerHTML = '';
    if(currentHistory.length===0){
      histList.innerHTML = '<li style="border:none;"><div class="empty-note" style="width:100%;">まだ履歴がありません。計算するとここに記録されます。</div></li>';
      return;
    }
    const sorted = [...currentHistory].sort((a,b)=> new Date(b.date)-new Date(a.date));
    sorted.forEach(entry=>{
      const li = document.createElement('li');
      li.innerHTML = `
        <div>
          <div class="hd-date">${fmtDate(entry.date)}</div>
          <div class="hd-vals">${entry.inputSummary}</div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="hd-bmi">${entry.result.display}${currentCalc.unit?(' '+currentCalc.unit):''}</div>
          <button class="del" title="削除" data-id="${entry.id}">✕</button>
        </div>`;
      histList.appendChild(li);
    });
    histList.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        currentHistory = currentHistory.filter(e=>e.id!==btn.dataset.id);
        saveJSON(storageKey(currentCalc.id,'history'), currentHistory);
        renderHistoryList(); renderGraph(); renderPredict();
      });
    });
  }

  document.getElementById('clearAllBtn').addEventListener('click', ()=>{
    if(currentHistory.length===0) return;
    if(!confirm('この計算機の履歴をすべて削除します。よろしいですか？')) return;
    currentHistory = [];
    saveJSON(storageKey(currentCalc.id,'history'), currentHistory);
    renderHistoryList(); renderGraph(); renderPredict();
  });

  function renderGraph(){
    const section = document.getElementById('graphSection');
    if(!currentCalc.trend){ section.style.display='none'; return; }
    section.style.display='block';
    const container = document.getElementById('graphContainer');
    const usable = currentHistory.filter(e=>e.result.value!==null && e.result.value!==undefined);
    if(usable.length===0){
      container.innerHTML = '<div class="empty-note">履歴が貯まるとグラフが表示されます。</div>';
      return;
    }
    const sorted = [...usable].sort((a,b)=> new Date(a.date)-new Date(b.date));
    const values = sorted.map(e=>e.result.value);
    const W=560,H=200,padL=34,padR=16,padT=16,padB=26;
    let minV = Math.min(...values), maxV = Math.max(...values);
    if(minV === maxV) { minV -= 1; maxV += 1; }
    const n = values.length;
    const x = i => n===1 ? padL+(W-padL-padR)/2 : padL+(i/(n-1))*(W-padL-padR);
    const y = v => padT + (1-(v-minV)/(maxV-minV))*(H-padT-padB);
    let gridLines='';
    for(let i=0;i<=3;i++){
      const gy = padT+(i/3)*(H-padT-padB);
      const val = maxV-(i/3)*(maxV-minV);
      gridLines += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}"/>`;
      gridLines += `<text x="4" y="${gy+3}">${val.toFixed(1)}</text>`;
    }
    let pathD='', points='';
    sorted.forEach((e,i)=>{
      const px=x(i), py=y(e.result.value);
      pathD += (i===0?'M':'L')+px+','+py+' ';
      points += `<circle class="graph-point" cx="${px}" cy="${py}" r="3.5"/>`;
    });
    let xLabels='';
    const step = Math.max(1, Math.ceil(n/5));
    sorted.forEach((e,i)=>{
      if(i%step===0 || i===n-1) xLabels += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtDate(e.date).slice(5)}</text>`;
    });
    container.innerHTML = `<svg class="graph" viewBox="0 0 ${W} ${H}">
      <g class="graph-grid">${gridLines}</g>
      <g class="graph-axis">${xLabels}</g>
      <path class="graph-line" d="${pathD.trim()}"/>
      ${points}
    </svg>`;
  }

  function linearRegression(values){
    const n=values.length, xs=values.map((_,i)=>i);
    const meanX = xs.reduce((a,b)=>a+b,0)/n, meanY = values.reduce((a,b)=>a+b,0)/n;
    let num=0, den=0;
    for(let i=0;i<n;i++){ num += (xs[i]-meanX)*(values[i]-meanY); den += (xs[i]-meanX)**2; }
    const slope = den===0?0:num/den;
    return {slope, intercept: meanY-slope*meanX};
  }
  function renderPredict(){
    const section = document.getElementById('predictSection');
    if(!currentCalc.trend){ section.style.display='none'; return; }
    section.style.display='block';
    const container = document.getElementById('predictContainer');
    const MIN = 3;
    const usable = currentHistory.filter(e=>e.result.value!==null && e.result.value!==undefined);
    if(usable.length < MIN){
      container.innerHTML = `<div class="predict-none">予測にはあと ${MIN-usable.length} 回分のデータが必要です（現在 ${usable.length} 回）。</div>`;
      return;
    }
    const sorted = [...usable].sort((a,b)=> new Date(a.date)-new Date(b.date));
    const values = sorted.map(e=>e.result.value);
    const {slope, intercept} = linearRegression(values);
    const nextX = values.length;
    const predicted = slope*nextX+intercept;
    const trend = slope>0.02 ? '上昇傾向' : (slope<-0.02 ? '下降傾向' : 'ほぼ横ばい');
    container.innerHTML = `<div class="predict-box">
      <div class="p-label">次回の推定値（参考値）</div>
      <div class="p-value mono">${round2(predicted)}${currentCalc.unit?(' '+currentCalc.unit):''}</div>
      <div class="p-note">過去${values.length}回のデータから線形回帰によって推定しています。直近の傾向は「${trend}」です。</div>
      <div class="p-caveat">※ 未来を当てる機能ではなく、過去の傾向を延長した場合の参考値です。</div>
    </div>`;
  }

  showHome();
})();
</script>

</body></html>
