<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Calculator — BMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf9f5;
    --paper-deep:#f2f0e8;
    --line:#dcd9cc;
    --line-soft:#e9e7dc;
    --ink:#1e2a2b;
    --ink-soft:#5a6866;
    --ink-faint:#93a09c;
    --sage:#4f7a5c;
    --sage-dark:#365441;
    --sage-tint:#e2ebe3;
    --rust:#8a4a35;
    --rust-tint:#f3e3dc;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px);
    background-size: 100% 32px;
    color:var(--ink);
    font-family: 'Space Grotesk', -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .mono{font-family:'JetBrains Mono', monospace;}

  /* ---- ruler tick header bar ---- */
  .ruler{
    height:14px;
    background-image: repeating-linear-gradient(
      to right,
      var(--ink-faint) 0, var(--ink-faint) 1px,
      transparent 1px, transparent 12px
    );
    background-position: 6px 0;
    opacity:0.55;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:6px;
  }
  header.top .brand{
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
  }
  header.top .brand small{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-weight:400;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin-top:2px;
  }
  header.top .tool-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--sage-dark);
    background:var(--sage-tint);
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:20px;
  }

  /* ---- tabs ---- */
  nav.tabs{
    display:flex;
    gap:2px;
    margin:22px 0 0;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    flex:1;
    appearance:none;
    border:1px solid transparent;
    border-bottom:none;
    background:transparent;
    padding:11px 10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:var(--radius) var(--radius) 0 0;
    position:relative;
    top:1px;
  }
  nav.tabs button.active{
    color:var(--ink);
    background:var(--paper-deep);
    border-color:var(--line);
    border-bottom:1px solid var(--paper-deep);
  }

  section.panel{
    display:none;
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-top:none;
    border-radius:0 0 6px 6px;
    padding:24px 22px 26px;
  }
  section.panel.active{display:block;}

  /* ---- input fields (ruler-underline style) ---- */
  .field{
    margin-bottom:20px;
  }
  .field label{
    display:block;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:6px;
    text-transform:uppercase;
    font-weight:600;
  }
  .field .input-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    border-bottom:2px solid var(--ink);
    padding-bottom:6px;
  }
  .field input{
    flex:1;
    border:none;
    background:transparent;
    font-family:'JetBrains Mono', monospace;
    font-size:26px;
    font-weight:600;
    color:var(--ink);
    padding:2px 0;
    outline:none;
    min-width:0;
  }
  .field input::placeholder{color:var(--ink-faint); font-weight:400;}
  .field .unit{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--ink-faint);
  }
  .field .input-row:focus-within{border-color:var(--sage-dark);}

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    border-radius:20px;
    padding:12px 22px;
    font-size:14px;
    letter-spacing:0.01em;
  }
  .btn-primary{
    width:100%;
    background:var(--sage-dark);
    color:#fff;
  }
  .btn-primary:hover{background:var(--sage);}
  .btn-ghost{
    background:transparent;
    color:var(--rust);
    border:1px solid var(--line);
    padding:7px 14px;
    font-size:12px;
  }
  .btn-ghost:hover{background:var(--rust-tint);}

  .error{
    color:var(--rust);
    font-size:12.5px;
    margin-top:8px;
    font-family:'JetBrains Mono', monospace;
    display:none;
  }

  /* ---- result readout ---- */
  .readout{
    margin-top:26px;
    border-top:1px dashed var(--line);
    padding-top:22px;
    display:none;
  }
  .readout.show{display:block;}
  .readout .label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:4px;
  }
  .readout .value-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    border-bottom:3px solid var(--ink);
    padding-bottom:8px;
  }
  .readout .value{
    font-family:'JetBrains Mono', monospace;
    font-size:52px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .readout .value-unit{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:var(--ink-faint);
  }
  .badge{
    display:inline-block;
    margin-top:10px;
    font-size:12px;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    font-family:'JetBrains Mono', monospace;
  }
  .badge.low{background:#e5eef7; color:#2f5f80;}
  .badge.normal{background:var(--sage-tint); color:var(--sage-dark);}
  .badge.over{background:#f8ecd4; color:#8a6a1f;}
  .badge.obese{background:var(--rust-tint); color:var(--rust);}

  .prev-box{
    margin-top:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .prev-box .prev-value{
    font-family:'JetBrains Mono', monospace;
    color:var(--ink);
    font-weight:600;
  }
  .diff-up{color:var(--rust);}
  .diff-down{color:var(--sage-dark);}

  /* ---- history list ---- */
  .hist-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .hist-head h2{
    font-size:14px;
    margin:0;
    letter-spacing:0.03em;
  }
  .hist-list{
    list-style:none;
    margin:0 0 26px;
    padding:0;
    border-top:1px solid var(--line);
  }
  .hist-list li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 2px;
    border-bottom:1px solid var(--line-soft);
    font-size:13.5px;
  }
  .hist-list .hd-date{
    font-family:'JetBrains Mono', monospace;
    color:var(--ink-soft);
    font-size:12px;
  }
  .hist-list .hd-vals{
    color:var(--ink-faint);
    font-size:11.5px;
    margin-top:2px;
  }
  .hist-list .hd-bmi{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:16px;
  }
  .hist-list button.del{
    background:none;
    border:none;
    color:var(--ink-faint);
    cursor:pointer;
    font-size:16px;
    padding:2px 6px;
  }
  .hist-list button.del:hover{color:var(--rust);}
  .empty-note{
    color:var(--ink-faint);
    font-size:13px;
    padding:20px 2px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:6px;
  }

  /* ---- graph ---- */
  .graph-box{
    margin-bottom:24px;
  }
  .graph-box h2{font-size:14px; margin:0 0 10px; letter-spacing:0.03em;}
  svg.graph{width:100%; height:auto; display:block;}
  .graph-grid line{stroke:var(--line-soft); stroke-width:1;}
  .graph-axis text{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    fill:var(--ink-faint);
  }
  .graph-line{
    fill:none;
    stroke:var(--sage-dark);
    stroke-width:2;
    stroke-dasharray:4 3;
  }
  .graph-point{fill:var(--sage-dark);}
  .graph-predict-line{
    fill:none;
    stroke:var(--rust);
    stroke-width:1.6;
    stroke-dasharray:2 3;
  }
  .graph-predict-point{fill:var(--rust);}

  /* ---- prediction box ---- */
  .predict-box{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:16px 16px 14px;
  }
  .predict-box .p-label{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--rust);
    font-weight:600;
    margin-bottom:6px;
  }
  .predict-box .p-value{
    font-family:'JetBrains Mono', monospace;
    font-size:30px;
    font-weight:700;
    color:var(--ink);
  }
  .predict-box .p-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:8px;
    line-height:1.6;
  }
  .predict-box .p-caveat{
    font-size:11px;
    color:var(--ink-faint);
    margin-top:10px;
    border-top:1px dashed var(--line);
    padding-top:8px;
  }
  .predict-none{
    font-size:12.5px;
    color:var(--ink-faint);
    padding:14px 2px;
  }

  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--ink-faint);
    margin-top:30px;
    font-family:'JetBrains Mono', monospace;
  }

  @media (max-width:420px){
    .readout .value{font-size:42px;}
    .wrap{padding:20px 14px 50px;}
  }
</style>
</head>
<body>
<div class="ruler"></div>
<div class="wrap">

  <header class="top">
    <div class="brand">Smart Calculator<small>計算 → 記録 → 予測</small></div>
    <div class="tool-tag">01 / BMI</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="calc">計算する</button>
    <button class="tab-btn" data-tab="history">履歴・グラフ</button>
  </nav>

  <!-- ===== CALC PANEL ===== -->
  <section class="panel active" id="panel-calc">
    <div class="field">
      <label for="height">身長</label>
      <div class="input-row">
        <input type="number" id="height" inputmode="decimal" placeholder="170" step="0.1">
        <span class="unit">cm</span>
      </div>
    </div>
    <div class="field">
      <label for="weight">体重</label>
      <div class="input-row">
        <input type="number" id="weight" inputmode="decimal" placeholder="60" step="0.1">
        <span class="unit">kg</span>
      </div>
    </div>

    <button class="btn btn-primary" id="calcBtn">計算する</button>
    <div class="error" id="errorMsg"></div>

    <div class="readout" id="readout">
      <div class="label">BMI</div>
      <div class="value-row">
        <span class="value mono" id="bmiValue">--</span>
        <span class="value-unit">kg/m²</span>
      </div>
      <span class="badge" id="bmiBadge"></span>

      <div class="prev-box" id="prevBox" style="display:none;">
        <span>前回（<span class="mono" id="prevDate"></span>）</span>
        <span class="prev-value mono" id="prevValue"></span>
      </div>
    </div>
  </section>

  <!-- ===== HISTORY PANEL ===== -->
  <section class="panel" id="panel-history">

    <div class="graph-box">
      <h2>推移グラフ</h2>
      <div id="graphContainer"></div>
    </div>

    <div class="graph-box">
      <h2>簡易予測</h2>
      <div id="predictContainer"></div>
    </div>

    <div class="hist-head">
      <h2>計算履歴</h2>
      <button class="btn btn-ghost" id="clearAllBtn">全履歴削除</button>
    </div>
    <ul class="hist-list" id="histList"></ul>

  </section>

  <div class="footer-note">DATA STORED PRIVATELY IN THIS ARTIFACT — 個人ごとに保存されます</div>
</div>

<script>
(function(){
  const KEY_LAST = 'bmi:lastInput';
  const KEY_HISTORY = 'bmi:history';

  const heightEl = document.getElementById('height');
  const weightEl = document.getElementById('weight');
  const calcBtn = document.getElementById('calcBtn');
  const errorMsg = document.getElementById('errorMsg');
  const readout = document.getElementById('readout');
  const bmiValueEl = document.getElementById('bmiValue');
  const bmiBadgeEl = document.getElementById('bmiBadge');
  const prevBox = document.getElementById('prevBox');
  const prevDateEl = document.getElementById('prevDate');
  const prevValueEl = document.getElementById('prevValue');
  const histList = document.getElementById('histList');
  const clearAllBtn = document.getElementById('clearAllBtn');
  const graphContainer = document.getElementById('graphContainer');
  const predictContainer = document.getElementById('predictContainer');

  let history = [];

  // ---------- storage helpers (ブラウザの localStorage を使用) ----------
  async function loadLastInput(){
    try{
      const raw = localStorage.getItem(KEY_LAST);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  async function saveLastInput(data){
    try{ localStorage.setItem(KEY_LAST, JSON.stringify(data)); }
    catch(e){ console.error('保存に失敗しました', e); }
  }
  async function loadHistory(){
    try{
      const raw = localStorage.getItem(KEY_HISTORY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  async function saveHistory(list){
    try{ localStorage.setItem(KEY_HISTORY, JSON.stringify(list)); }
    catch(e){ console.error('保存に失敗しました', e); }
  }

  // ---------- BMI logic ----------
  function calcBmi(h_cm, w_kg){
    const h_m = h_cm / 100;
    return w_kg / (h_m * h_m);
  }
  function bmiCategory(bmi){
    if(bmi < 18.5) return {label:'低体重', cls:'low'};
    if(bmi < 25)   return {label:'普通体重', cls:'normal'};
    if(bmi < 30)   return {label:'肥満（1度）', cls:'over'};
    return {label:'肥満（2度以上）', cls:'obese'};
  }
  function fmtDate(iso){
    const d = new Date(iso);
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}/${m}/${day}`;
  }

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab === 'history'){ renderGraph(); renderPredict(); }
    });
  });

  // ---------- calculate ----------
  calcBtn.addEventListener('click', async ()=>{
    errorMsg.style.display = 'none';
    const h = parseFloat(heightEl.value);
    const w = parseFloat(weightEl.value);

    if(!h || !w || h < 50 || h > 250 || w < 10 || w > 300){
      errorMsg.textContent = '身長は50〜250cm、体重は10〜300kgの範囲で入力してください。';
      errorMsg.style.display = 'block';
      readout.classList.remove('show');
      return;
    }

    const prevEntry = history.length ? history[history.length-1] : null;

    const bmi = calcBmi(h, w);
    const bmiRounded = Math.round(bmi * 10) / 10;
    const cat = bmiCategory(bmi);

    bmiValueEl.textContent = bmiRounded.toFixed(1);
    bmiBadgeEl.textContent = cat.label;
    bmiBadgeEl.className = 'badge ' + cat.cls;

    if(prevEntry){
      prevBox.style.display = 'flex';
      prevDateEl.textContent = fmtDate(prevEntry.date);
      const diff = bmiRounded - prevEntry.bmi;
      const diffStr = (diff > 0 ? '+' : '') + diff.toFixed(1);
      const diffCls = diff > 0 ? 'diff-up' : (diff < 0 ? 'diff-down' : '');
      prevValueEl.innerHTML = `${prevEntry.bmi.toFixed(1)} <span class="${diffCls}">(${diffStr})</span>`;
    } else {
      prevBox.style.display = 'none';
    }

    readout.classList.add('show');

    // 保存
    await saveLastInput({height: h, weight: w});
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      date: new Date().toISOString(),
      height: h, weight: w, bmi: bmiRounded
    };
    history.push(entry);
    await saveHistory(history);
    renderHistoryList();
  });

  // ---------- history list ----------
  function renderHistoryList(){
    histList.innerHTML = '';
    if(history.length === 0){
      histList.innerHTML = '<li style="border:none;"><div class="empty-note" style="width:100%;">まだ履歴がありません。計算するとここに記録されます。</div></li>';
      return;
    }
    const sorted = [...history].sort((a,b)=> new Date(b.date) - new Date(a.date));
    sorted.forEach(entry=>{
      const li = document.createElement('li');
      li.innerHTML = `
        <div>
          <div class="hd-date">${fmtDate(entry.date)}</div>
          <div class="hd-vals">身長 ${entry.height}cm ・ 体重 ${entry.weight}kg</div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="hd-bmi">${entry.bmi.toFixed(1)}</div>
          <button class="del" title="削除" data-id="${entry.id}">✕</button>
        </div>
      `;
      histList.appendChild(li);
    });
    histList.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        history = history.filter(e => e.id !== btn.dataset.id);
        await saveHistory(history);
        renderHistoryList();
        renderGraph();
        renderPredict();
      });
    });
  }

  clearAllBtn.addEventListener('click', async ()=>{
    if(history.length === 0) return;
    if(!confirm('すべての履歴を削除します。よろしいですか？')) return;
    history = [];
    await saveHistory(history);
    renderHistoryList();
    renderGraph();
    renderPredict();
  });

  // ---------- graph ----------
  function renderGraph(){
    if(history.length === 0){
      graphContainer.innerHTML = '<div class="empty-note">履歴が貯まるとグラフが表示されます。</div>';
      return;
    }
    const sorted = [...history].sort((a,b)=> new Date(a.date) - new Date(b.date));
    const values = sorted.map(e=>e.bmi);
    const W = 560, H = 200, padL = 34, padR = 16, padT = 16, padB = 26;
    const minV = Math.min(...values) - 1;
    const maxV = Math.max(...values) + 1;
    const n = values.length;

    const x = i => n === 1 ? padL + (W-padL-padR)/2 : padL + (i/(n-1)) * (W-padL-padR);
    const y = v => padT + (1 - (v - minV)/(maxV - minV)) * (H - padT - padB);

    let gridLines = '';
    for(let i=0;i<=3;i++){
      const gy = padT + (i/3)*(H-padT-padB);
      const val = maxV - (i/3)*(maxV-minV);
      gridLines += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}"/>`;
      gridLines += `<text x="4" y="${gy+3}">${val.toFixed(1)}</text>`;
    }

    let pathD = '';
    let points = '';
    sorted.forEach((e,i)=>{
      const px = x(i), py = y(e.bmi);
      pathD += (i===0 ? 'M' : 'L') + px + ',' + py + ' ';
      points += `<circle class="graph-point" cx="${px}" cy="${py}" r="3.5"/>`;
    });

    let xLabels = '';
    const step = Math.max(1, Math.ceil(n/5));
    sorted.forEach((e,i)=>{
      if(i % step === 0 || i === n-1){
        xLabels += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtDate(e.date).slice(5)}</text>`;
      }
    });

    graphContainer.innerHTML = `
      <svg class="graph" viewBox="0 0 ${W} ${H}">
        <g class="graph-grid">${gridLines}</g>
        <g class="graph-axis">${xLabels}</g>
        <path class="graph-line" d="${pathD.trim()}"/>
        ${points}
      </svg>
    `;
  }

  // ---------- prediction ----------
  function linearRegression(values){
    const n = values.length;
    const xs = values.map((_,i)=>i);
    const meanX = xs.reduce((a,b)=>a+b,0)/n;
    const meanY = values.reduce((a,b)=>a+b,0)/n;
    let num=0, den=0;
    for(let i=0;i<n;i++){
      num += (xs[i]-meanX)*(values[i]-meanY);
      den += (xs[i]-meanX)*(xs[i]-meanX);
    }
    const slope = den === 0 ? 0 : num/den;
    const intercept = meanY - slope*meanX;
    return {slope, intercept};
  }

  function renderPredict(){
    const MIN_FOR_PREDICT = 3;
    if(history.length < MIN_FOR_PREDICT){
      predictContainer.innerHTML = `<div class="predict-none">予測にはあと ${MIN_FOR_PREDICT - history.length} 回分のデータが必要です（現在 ${history.length} 回）。</div>`;
      return;
    }
    const sorted = [...history].sort((a,b)=> new Date(a.date) - new Date(b.date));
    const values = sorted.map(e=>e.bmi);
    const {slope, intercept} = linearRegression(values);
    const nextX = values.length;
    const predicted = slope*nextX + intercept;
    const trend = slope > 0.02 ? '上昇傾向' : (slope < -0.02 ? '下降傾向' : 'ほぼ横ばい');

    predictContainer.innerHTML = `
      <div class="predict-box">
        <div class="p-label">次回の推定BMI（参考値）</div>
        <div class="p-value mono">${predicted.toFixed(1)}</div>
        <div class="p-note">過去${values.length}回のデータから線形回帰によって推定しています。直近の傾向は「${trend}」です。</div>
        <div class="p-caveat">※ これは未来を当てる機能ではなく、過去の傾向をそのまま延長した場合の参考値です。実際の体重管理の判断材料としてのみご利用ください。</div>
      </div>
    `;
  }

  // ---------- init ----------
  (async function init(){
    const last = await loadLastInput();
    if(last){
      heightEl.value = last.height;
      weightEl.value = last.weight;
    }
    history = await loadHistory();
    renderHistoryList();
    renderGraph();
    renderPredict();

    if(history.length){
      const latest = history[history.length-1];
      bmiValueEl.textContent = latest.bmi.toFixed(1);
      const cat = bmiCategory(latest.bmi);
      bmiBadgeEl.textContent = cat.label;
      bmiBadgeEl.className = 'badge ' + cat.cls;
      readout.classList.add('show');
      if(history.length > 1){
        const prevEntry = history[history.length-2];
        prevBox.style.display = 'flex';
        prevDateEl.textContent = fmtDate(prevEntry.date);
        const diff = latest.bmi - prevEntry.bmi;
        const diffStr = (diff > 0 ? '+' : '') + diff.toFixed(1);
        const diffCls = diff > 0 ? 'diff-up' : (diff < 0 ? 'diff-down' : '');
        prevValueEl.innerHTML = `${prevEntry.bmi.toFixed(1)} <span class="${diffCls}">(${diffStr})</span>`;
      }
    }
  })();
})();
</script>
</body>
</html>
